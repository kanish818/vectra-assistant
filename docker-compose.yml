services:
  vectra-pgvector:
    image: pgvector/pgvector:pg16
    container_name: vectra-pgvector
    environment:
      POSTGRES_USER: vectra
      POSTGRES_PASSWORD: vectra
      POSTGRES_DB: vectra_kb
    ports:
      - "5432:5432"
    volumes:
      - vectra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectra -d vectra_kb"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  vectra_pgdata:
